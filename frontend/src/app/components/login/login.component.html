<div class="auth-page">
  <div class="container auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <div class="auth-icon">🔑</div>
        <h2>Student Login</h2>
        <p>Access your Mind Care personal wellness portal</p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger">
          ⚠️ {{ errorMessage }}
          @if (emailNotVerified) {
            <div class="resend-block">
              <button class="btn-resend" (click)="resendVerification()">
                📧 Resend Verification Email
              </button>
            </div>
          }
        </div>
      }

      @if (successMessage) {
        <div class="alert alert-success">✅ {{ successMessage }}</div>
      }

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">Student Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email"
            class="form-control" placeholder="student@university.edu" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password"
            class="form-control" placeholder="••••••••" required />
        </div>

        <div class="form-links">
          <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" [disabled]="loading" class="btn btn-primary btn-block">
          {{ loading ? 'Logging in...' : 'Login to Portal' }}
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
      </div>
    </div>
  </div>
</div>
